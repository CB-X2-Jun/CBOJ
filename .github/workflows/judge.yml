name: CBOJ Judge

on:
  repository_dispatch:
    types: [judge]

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Single Language
        env:
          LANG: ${{ github.event.client_payload.language }}
        run: |
          sudo apt-get update
          case "$LANG" in
            "C") sudo apt-get install -y gcc ;;
            "C++98"|"C++03"|"C++11"|"C++14"|"C++17"|"C++20"|"C++23"|"C++26")
              sudo apt-get install -y g++ ;;
            "Python2") sudo apt-get install -y python2 ;;
            "Python3"|"PyPy3") sudo apt-get install -y python3 ;;
            "PyPy2") sudo apt-get install -y pypy ;;
            "Java8"|"Java21") sudo apt-get install -y openjdk-21-jdk ;;
            "Go") sudo apt-get install -y golang-go ;;
            "Rust") sudo apt-get install -y rustc cargo ;;
            "Ruby") sudo apt-get install -y ruby-full ;;
            "PHP") sudo apt-get install -y php-cli ;;
            "Javascript"|"Typescript") sudo apt-get install -y nodejs npm ;;
            "Lua") sudo apt-get install -y lua5.4 ;;
            "Perl") sudo apt-get install -y perl ;;
            "Haskell") sudo apt-get install -y ghc cabal-install ;;
            "Julia") sudo apt-get install -y julia ;;
            "Dart") sudo apt-get install -y dart ;;
            "Swift") sudo apt-get install -y swift ;;
            "Brainfuck") sudo apt-get install -y bf ;;
            "TeX") sudo apt-get install -y texlive-binaries ;;
            "Fortran") sudo apt-get install -y gfortran ;;
            "Ada") sudo apt-get install -y gnat ;;
            "Pascal") sudo apt-get install -y fpc ;;
            "BASIC") sudo apt-get install -y bwbasic ;;
            "Prolog") sudo apt-get install -y swi-prolog ;;
            "Lisp"|"Common Lisp") sudo apt-get install -y sbcl ;;
            "Tcl") sudo apt-get install -y tcl ;;
            "Erlang") sudo apt-get install -y erlang ;;
            "OCaml") sudo apt-get install -y ocaml ;;
            "Scala") sudo apt-get install -y scala ;;
            "Kotlin JVM") sudo apt-get install -y kotlin ;;
            "C#") sudo apt-get install -y mono-mcs ;;
            "F#") sudo apt-get install -y fsharp ;;
            "D") sudo apt-get install -y gdc ;;
            "Objective-C"|"Objective-C++") sudo apt-get install -y clang ;;
            "Bash") echo "Bash is built-in" ;;
            *) echo "Unknown language: $LANG"; exit 1 ;;
          esac

      - name: Run Judge
        env:
          RID: ${{ github.event.client_payload.rid }}
          LANG: ${{ github.event.client_payload.language }}
          CODE: ${{ github.event.client_payload.code }}
          TIME_LIMIT: ${{ github.event.client_payload.timeLimit }}
          MEMORY_LIMIT: ${{ github.event.client_payload.memoryLimit }}
          TEST_CASES: ${{ github.event.client_payload.testCases }}
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
        run: |
          # 写入源代码
          case "$LANG" in
            "C") EXT="c"; COMPILE="gcc -O2 main.c -o program"; RUN="./program" ;;
            "C++"*) EXT="cpp"; COMPILE="g++ -O2 main.cpp -o program"; RUN="./program" ;;
            "Python2"|"Python3"|"PyPy2"|"PyPy3") EXT="py"; COMPILE=""; RUN="python3 main.py" ;;
            "Java"*) EXT="java"; COMPILE="javac Main.java"; RUN="java Main" ;;
            "Go") EXT="go"; COMPILE="go build -o program main.go"; RUN="./program" ;;
            "Rust") EXT="rs"; COMPILE="rustc -O main.rs -o program"; RUN="./program" ;;
            "Ruby") EXT="rb"; COMPILE=""; RUN="ruby main.rb" ;;
            "PHP") EXT="php"; COMPILE=""; RUN="php main.php" ;;
            "Javascript") EXT="js"; COMPILE=""; RUN="node main.js" ;;
            "Typescript") EXT="ts"; COMPILE="tsc main.ts"; RUN="node main.js" ;;
            "C#") EXT="cs"; COMPILE="mcs main.cs"; RUN="mono main.exe" ;;
            "F#") EXT="fs"; COMPILE="fsharpc main.fs"; RUN="mono main.exe" ;;
            "D") EXT="d"; COMPILE="gdc -O2 main.d -o program"; RUN="./program" ;;
            "Lua") EXT="lua"; COMPILE=""; RUN="lua main.lua" ;;
            "Perl") EXT="pl"; COMPILE=""; RUN="perl main.pl" ;;
            "Haskell") EXT="hs"; COMPILE="ghc -O2 main.hs -o program"; RUN="./program" ;;
            "Julia") EXT="jl"; COMPILE=""; RUN="julia main.jl" ;;
            "Swift") EXT="swift"; COMPILE="swiftc -O main.swift -o program"; RUN="./program" ;;
            "Bash") EXT="sh"; COMPILE=""; RUN="bash main.sh" ;;
            "Fortran") EXT="f90"; COMPILE="gfortran -O2 main.f90 -o program"; RUN="./program" ;;
            "Ada") EXT="adb"; COMPILE="gnatmake main.adb -o program"; RUN="./program" ;;
            "Pascal") EXT="pas"; COMPILE="fpc -O2 main.pas -oprogram"; RUN="./program" ;;
            "BASIC") EXT="bas"; COMPILE=""; RUN="bwbasic main.bas" ;;
            "Prolog") EXT="pl"; COMPILE=""; RUN="swipl -q -t main -s main.pl" ;;
            "Lisp"|"Common Lisp") EXT="lisp"; COMPILE=""; RUN="sbcl --script main.lisp" ;;
            "Tcl") EXT="tcl"; COMPILE=""; RUN="tclsh main.tcl" ;;
            "Erlang") EXT="erl"; COMPILE="erlc main.erl"; RUN="erl -noshell -s main main -s init stop" ;;
            "OCaml") EXT="ml"; COMPILE="ocamlopt -o program main.ml"; RUN="./program" ;;
            "Scala") EXT="scala"; COMPILE="scalac main.scala"; RUN="scala Main" ;;
            "Kotlin JVM") EXT="kt"; COMPILE="kotlinc main.kt -include-runtime -d program.jar"; RUN="java -jar program.jar" ;;
            "Objective-C") EXT="m"; COMPILE="clang -O2 main.m -o program"; RUN="./program" ;;
            "Objective-C++") EXT="mm"; COMPILE="clang++ -O2 main.mm -o program"; RUN="./program" ;;
            "Dart") EXT="dart"; COMPILE="dart compile exe main.dart -o program"; RUN="./program" ;;
            "Brainfuck") EXT="bf"; COMPILE=""; RUN="bf main.bf" ;;
            "TeX") EXT="tex"; COMPILE=""; RUN="tex main.tex" ;;
            *) echo "Unsupported language: $LANG"; exit 1 ;;
          esac

          echo "$CODE" > "main.$EXT"

          # 编译
          if [[ -n "$COMPILE" ]]; then
            if ! $COMPILE 2> compile_error.log; then
              curl -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
                -d "{\"rid\":$RID,\"status\":\"compile_error\",\"result\":\"$(cat compile_error.log | head -c 500)\"}"
              exit 0
            fi
          fi

          # 解析测试用例
          echo "$TEST_CASES" | jq -c '.[]' | while read -r test; do
            INPUT=$(echo "$test" | jq -r '.input')
            EXPECTED=$(echo "$test" | jq -r '.output')
            
            START=$(date +%s%N)
            OUTPUT=$(echo "$INPUT" | timeout ${TIME_LIMIT:-2}s $RUN 2>&1 || echo "TLE_ERROR")
            END=$(date +%s%N)
            TIME_USED=$((($END - $START) / 1000000))
            
            # 清理输出
            OUTPUT=$(echo "$OUTPUT" | sed -e 's/[[:space:]]*$//')
            EXPECTED=$(echo "$EXPECTED" | sed -e 's/[[:space:]]*$//')
            
            if [[ "$OUTPUT" == "TLE_ERROR" ]]; then
              STATUS="time_limit_exceeded"
              break
            elif [[ "$OUTPUT" != "$EXPECTED" ]]; then
              STATUS="wrong_answer"
              break
            else
              STATUS="accepted"
            fi
          done

          # 回传结果
          curl -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d "{\"rid\":$RID,\"status\":\"$STATUS\",\"time_used\":$TIME_USED,\"memory_used\":0}"
