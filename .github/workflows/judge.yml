name: CBOJ Judge

on:
  repository_dispatch:
    types: [judge]

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Single Language
        env:
          LANG: ${{ github.event.client_payload.language }}
        run: |
          sudo apt-get update
          case "$LANG" in
            "C") sudo apt-get install -y gcc ;;
            "C++98"|"C++03"|"C++11"|"C++14"|"C++17"|"C++20"|"C++23"|"C++26")
              sudo apt-get install -y g++ ;;
            "Python3") sudo apt-get install -y python3 ;;
            "PyPy3") sudo apt-get install -y pypy3 ;;
            "Java8") sudo apt-get install -y openjdk-8-jdk ;;
            "Java11") sudo apt-get install -y openjdk-11-jdk ;;
            "Java17") sudo apt-get install -y openjdk-17-jdk ;;
            "Java21") sudo apt-get install -y openjdk-21-jdk ;;
            "Go") sudo apt-get install -y golang-go ;;
            "Rust") sudo apt-get install -y rustc cargo ;;
            "Ruby") sudo apt-get install -y ruby-full ;;
            "PHP") sudo apt-get install -y php-cli ;;
            "Javascript"|"Typescript")
              sudo apt-get install -y nodejs npm
              sudo npm install -g typescript
              ;;
            "Lua") sudo apt-get install -y lua5.4 ;;
            "Perl") sudo apt-get install -y perl ;;
            "Haskell") sudo apt-get install -y ghc cabal-install ;;
            "Julia")
              JULIA_VERSION="1.10.5"
            
              wget https://julialang-s3.julialang.org/bin/linux/x64/1.10/julia-${JULIA_VERSION}-linux-x86_64.tar.gz
            
              tar -xzf julia-${JULIA_VERSION}-linux-x86_64.tar.gz -C /opt
            
              sudo ln -sf /opt/julia-${JULIA_VERSION}/bin/julia /usr/local/bin/julia
            
              julia --version
              ;;
            "Dart")
              sudo sh -c 'echo "deb [trusted=yes] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main" > /etc/apt/sources.list.d/dart_stable.list'
              sudo apt-get update
              sudo apt-get install -y dart
              ;;
            "Swift") sudo apt-get install -y swift ;;
            "Brainfuck") sudo apt-get install -y beef ;;
            "TeX") sudo apt-get install -y texlive-binaries ;;
            "Fortran") sudo apt-get install -y gfortran ;;
            "Ada") sudo apt-get install -y gnat ;;
            "Pascal") sudo apt-get install -y fpc ;;
            "BASIC") sudo apt-get install -y bwbasic ;;
            "Prolog") sudo apt-get install -y swi-prolog ;;
            "Lisp"|"Common Lisp") sudo apt-get install -y sbcl ;;
            "Tcl") sudo apt-get install -y tcl ;;
            "Erlang") sudo apt-get install -y erlang ;;
            "OCaml") sudo apt-get install -y ocaml ;;
            "Scala") sudo apt-get install -y scala ;;
            "Kotlin JVM") sudo apt-get install -y kotlin ;;
            "C#") sudo apt-get install -y mono-mcs ;;
            "F#") sudo apt-get install -y fsharp ;;
            "D") sudo apt-get install -y gdc ;;
            "Objective-C"|"Objective-C++") sudo apt-get install -y clang ;;
            "Powershell") sudo apt-get install -y powershell ;;
            "Eiffel")
              EIFFEL_DIR="Eiffel_25.12_rev_98922-linux-x86-64"
            
              wget -q https://www.eiffel.com/cdn/EiffelStudio/25.12/98922/${EIFFEL_DIR}.tar.bz2
              tar -xjf ${EIFFEL_DIR}.tar.bz2
            
              echo "ISE_EIFFEL=$PWD/${EIFFEL_DIR}" >> $GITHUB_ENV
              echo "ISE_PLATFORM=linux-x86-64" >> $GITHUB_ENV
              echo "ISE_LIBRARY=$PWD/${EIFFEL_DIR}/library" >> $GITHUB_ENV
            
              echo "$PWD/${EIFFEL_DIR}/studio/spec/linux-x86-64/bin" >> $GITHUB_PATH

              printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<system xmlns="http://www.eiffel.com/developers/xml/configuration" name="main" uuid="123a56b8-12c4-41ca-aaa9-11445b789abc">' \
              '  <target name="main">' \
              '    <root class="MAIN" feature="make"/>' \
              '    <cluster name="main" location="."/>' \
              '  </target>' \
              '</system>' \
              > default.ecf
              ;;
            "Ceylon")
              sudo apt-get install -y openjdk-8-jdk ant
              echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
              git clone --depth 1 --branch _old/1.3.3 https://github.com/eclipse-archived/ceylon.git
              cd ceylon
              ant clean dist
              sudo mv dist/dist /opt/ceylon
              echo "CEYLON_HOME=/opt/ceylon" >> $GITHUB_ENV
              echo "/opt/ceylon/bin" >> $GITHUB_PATH
              ;;
            "Bash") echo "Bash is built-in" ;;
            *) echo "Unknown language: $LANG"; exit 1 ;;
          esac

      - name: Run Judge
        env:
          RID: ${{ github.event.client_payload.rid }}
          LANG: ${{ github.event.client_payload.language }}
          CODE: '${{ github.event.client_payload.code }}'
          TIME_LIMIT: ${{ github.event.client_payload.timeLimit }}
          MEMORY_LIMIT: ${{ github.event.client_payload.memoryLimit }}
          TEST_CASES: '${{ github.event.client_payload.testCases }}'
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
        run: |
          CODE_RAW=$(echo "$CODE" | jq -r '.')
          TIMEOUT_SEC=$(python3 -c "print(max($TIME_LIMIT/1000, 0.1))")
          MEM_KB=$((MEMORY_LIMIT * 1024))

          # ---------- 语言特定处理 ----------
          case "$LANG" in
            "Java8"|"Java11"|"Java17"|"Java21")
              echo "$CODE_RAW" > Main.java
              if ! javac Main.java 2> compile_error.log; then
                ERROR_MSG=$(cat compile_error.log | head -c 500 | jq -sR .)
                curl -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
                  -d "{\"rid\":$RID,\"status\":\"compile_error\",\"result\":$ERROR_MSG}"
                exit 0
              fi
              RUN_CMD="java Main"
              SKIP_COMMON=1
              ;;

            "Eiffel")
              echo "$CODE_RAW" > main.e
              # 复制 ECF 配置文件到当前目录
              cp default.ecf main.ecf
              if ! ec -batch -config main.ecf -c_compile -finalize 2> compile_error.log; then
                ERROR_MSG=$(cat compile_error.log | head -c 500 | jq -sR .)
                curl -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
                  -d "{\"rid\":$RID,\"status\":\"compile_error\",\"result\":$ERROR_MSG}"
                exit 0
              fi
              # 检查生成的可执行文件
              if [ -f "EIFGENs/main/W_code/main" ]; then
                RUN_CMD="./EIFGENs/main/W_code/main"
              elif [ -f "EIFGENs/main/F_code/main" ]; then
                RUN_CMD="./EIFGENs/main/F_code/main"
              else
                ERROR_MSG="Eiffel compilation succeeded but executable not found"
                curl -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
                  -d "{\"rid\":$RID,\"status\":\"compile_error\",\"result\":\"$ERROR_MSG\"}"
                exit 0
              fi
              SKIP_COMMON=1
              ;;

            "Ceylon")
              mkdir -p source/cboj
              echo 'module cboj "1.0.0" {}' > source/cboj/module.ceylon
              echo "$CODE_RAW" > source/cboj/run.ceylon
              if ! ceylon compile --source source cboj 2> compile_error.log; then
                ERROR_MSG=$(cat compile_error.log | head -c 500 | jq -sR .)
                curl -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
                  -d "{\"rid\":$RID,\"status\":\"compile_error\",\"result\":$ERROR_MSG}"
                exit 0
              fi
              RUN_CMD="ceylon run cboj/1.0.0"
              SKIP_COMMON=1
              ;;

            # 其他语言
            "C") EXT="c"; COMPILE="gcc -O2 main.c -o program"; RUN_CMD="./program" ;;
            "C++98") EXT="cpp"; COMPILE="g++ -std=c++98 -O2 main.cpp -o program"; RUN_CMD="./program" ;;
            "C++03") EXT="cpp"; COMPILE="g++ -std=c++03 -O2 main.cpp -o program"; RUN_CMD="./program" ;;
            "C++11") EXT="cpp"; COMPILE="g++ -std=c++11 -O2 main.cpp -o program"; RUN_CMD="./program" ;;
            "C++14") EXT="cpp"; COMPILE="g++ -std=c++14 -O2 main.cpp -o program"; RUN_CMD="./program" ;;
            "C++17") EXT="cpp"; COMPILE="g++ -std=c++17 -O2 main.cpp -o program"; RUN_CMD="./program" ;;
            "C++20") EXT="cpp"; COMPILE="g++ -std=c++20 -O2 main.cpp -o program"; RUN_CMD="./program" ;;
            "C++23") EXT="cpp"; COMPILE="g++ -std=c++23 -O2 main.cpp -o program"; RUN_CMD="./program" ;;
            "C++26") EXT="cpp"; COMPILE="g++ -std=c++26 -O2 main.cpp -o program"; RUN_CMD="./program" ;;
            "Python3") EXT="py"; COMPILE=""; RUN_CMD="python3 main.py" ;;
            "PyPy3") EXT="py"; COMPILE=""; RUN_CMD="pypy3 main.py" ;;
            "Go") EXT="go"; COMPILE="go build -o program main.go"; RUN_CMD="./program" ;;
            "Rust") EXT="rs"; COMPILE="rustc -O main.rs -o program"; RUN_CMD="./program" ;;
            "Ruby") EXT="rb"; COMPILE=""; RUN_CMD="ruby main.rb" ;;
            "PHP") EXT="php"; COMPILE=""; RUN_CMD="php main.php" ;;
            "Javascript") EXT="js"; COMPILE=""; RUN_CMD="node main.js" ;;
            "Typescript") EXT="ts"; COMPILE="tsc main.ts"; RUN_CMD="node main.js" ;;
            "C#") EXT="cs"; COMPILE="mcs main.cs"; RUN_CMD="mono main.exe" ;;
            "F#") EXT="fs"; COMPILE="fsharpc main.fs"; RUN_CMD="mono main.exe" ;;
            "D") EXT="d"; COMPILE="gdc -O2 main.d -o program"; RUN_CMD="./program" ;;
            "Lua") EXT="lua"; COMPILE=""; RUN_CMD="lua main.lua" ;;
            "Perl") EXT="pl"; COMPILE=""; RUN_CMD="perl main.pl" ;;
            "Haskell") EXT="hs"; COMPILE="ghc -O2 main.hs -o program"; RUN_CMD="./program" ;;
            "Julia") EXT="jl"; COMPILE=""; RUN_CMD="julia main.jl"; which julia; julia --version ;;
            "Swift") EXT="swift"; COMPILE="swiftc -O main.swift -o program"; RUN_CMD="./program" ;;
            "Bash") EXT="sh"; COMPILE=""; RUN_CMD="bash main.sh" ;;
            "Fortran") EXT="f90"; COMPILE="gfortran -O2 main.f90 -o program"; RUN_CMD="./program" ;;
            "Ada") EXT="adb"; COMPILE="gnatmake main.adb -o program"; RUN_CMD="./program" ;;
            "Pascal") EXT="pas"; COMPILE="fpc -O2 main.pas -oprogram"; RUN_CMD="./program" ;;
            "BASIC") EXT="bas"; COMPILE=""; RUN_CMD="bwbasic main.bas" ;;
            "Prolog") EXT="pl"; COMPILE=""; RUN_CMD="swipl -q -t main -s main.pl" ;;
            "Lisp"|"Common Lisp") EXT="lisp"; COMPILE=""; RUN_CMD="sbcl --script main.lisp" ;;
            "Tcl") EXT="tcl"; COMPILE=""; RUN_CMD="tclsh main.tcl" ;;
            "Erlang") EXT="erl"; COMPILE="erlc main.erl"; RUN_CMD="erl -noshell -s main start -s init stop" ;;
            "OCaml") EXT="ml"; COMPILE="ocamlopt -o program main.ml"; RUN_CMD="./program" ;;
            "Scala") EXT="scala"; COMPILE="scalac main.scala"; RUN_CMD="scala Main" ;;
            "Kotlin JVM") EXT="kt"; COMPILE="kotlinc main.kt -include-runtime -d program.jar"; RUN_CMD="java -jar program.jar" ;;
            "Objective-C") EXT="m"; COMPILE="clang -O2 main.m -o program"; RUN_CMD="./program" ;;
            "Objective-C++") EXT="mm"; COMPILE="clang++ -O2 main.mm -o program"; RUN_CMD="./program" ;;
            "Dart") EXT="dart"; COMPILE=""; RUN_CMD="dart run main.dart" ;;
            "Brainfuck") EXT="bf"; COMPILE=""; RUN_CMD="beef main.bf" ;;
            "TeX") EXT="tex"; COMPILE=""; RUN_CMD="tex -interaction=batchmode main.tex" ;;
            "Powershell") EXT="ps1"; COMPILE=""; RUN_CMD="pwsh -ExecutionPolicy Bypass -File main.ps1" ;;
            *) echo "Unsupported language: $LANG"; exit 1 ;;
          esac

          # ---------- 通用编译（非 Java/Eiffel/Ceylon） ----------
          if [ -z "$SKIP_COMMON" ]; then
            echo "$CODE_RAW" > "main.$EXT"
            if [[ -n "$COMPILE" ]]; then
              if ! $COMPILE 2> compile_error.log; then
                ERROR_MSG=$(cat compile_error.log | head -c 500 | jq -sR .)
                curl -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
                  -d "{\"rid\":$RID,\"status\":\"compile_error\",\"result\":$ERROR_MSG}"
                exit 0
              fi
            fi
          fi

          # ---------- 测试循环 ----------
          TOTAL_TIME=0
          MAX_MEM=0
          STATUS="accepted"

          echo "$TEST_CASES" | jq -c '.[]' > /tmp/test_cases.txt
          while read -r test; do
            INPUT=$(echo "$test" | jq -r '.input')
            EXPECTED=$(echo "$test" | jq -r '.output')
            OUT_FILE=$(mktemp)
            ERR_FILE=$(mktemp)
            MEM_FILE=$(mktemp)

            START=$(date +%s%N)
            # 使用 bash -c 稳定执行，避免 shell 解析问题
            (ulimit -v "$MEM_KB" 2>/dev/null || true
             echo "$INPUT" | /usr/bin/time -f "%M" -o "$MEM_FILE" timeout "$TIMEOUT_SEC"s bash -c "$RUN_CMD" > "$OUT_FILE" 2> "$ERR_FILE"
            )
            EXIT_CODE=$?
            END=$(date +%s%N)

            TIME_USED=$((($END - $START) / 1000000))
            TOTAL_TIME=$((TOTAL_TIME + TIME_USED))

            MEM_USED=$(cat "$MEM_FILE" 2>/dev/null | tr -d '\n')
            [ -z "$MEM_USED" ] && MEM_USED=0
            [ "$MEM_USED" -gt "$MAX_MEM" ] && MAX_MEM=$MEM_USED

            OUTPUT=$(cat "$OUT_FILE" 2>/dev/null | sed -e 's/[[:space:]]*$//')
            EXPECTED=$(echo "$EXPECTED" | sed -e 's/[[:space:]]*$//')
            
            echo "========== DEBUG =========="
            echo "EXIT_CODE=$EXIT_CODE"
            echo "STDOUT:"
            cat "$OUT_FILE" || true
            echo "STDERR:"
            cat "$ERR_FILE" || true
            echo "=========================="
            
            END=$(date +%s%N)

            rm -f "$OUT_FILE" "$ERR_FILE" "$MEM_FILE"

            if [ "$EXIT_CODE" -eq 124 ] || [ "$EXIT_CODE" -eq 137 ]; then
              STATUS="time_limit_exceeded"
              break
            elif [ "$EXIT_CODE" -ne 0 ]; then
              STATUS="runtime_error"
              break
            elif [ "$OUTPUT" != "$EXPECTED" ]; then
              STATUS="wrong_answer"
              break
            fi
          done < /tmp/test_cases.txt

          MAX_MEM_MB=$(python3 -c "print(round($MAX_MEM/1024, 2))")
          curl -X POST "$CALLBACK_URL" -H "Content-Type: application/json" \
            -d "{\"rid\":$RID,\"status\":\"$STATUS\",\"time_used\":$TOTAL_TIME,\"memory_used\":$MAX_MEM_MB}"
