<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CBOJ - 注册</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="navbar"></nav>
  <div class="container" style="max-width: 400px; margin: 4rem auto;">
    <h1>注册</h1>
    <div class="card">
      <form id="register-form">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label>昵称（可选）</label>
          <input type="text" id="nickname">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-success">注册</button>
        <p style="margin-top: 1rem;">已有账号？<a href="/login.html">去登录</a></p>
      </form>
      <div id="error" style="color: red; margin-top: 0.5rem;"></div>
    </div>
  </div>
  <script type="module">
    import { register, login, getUserInfo } from '/js/api.js';
    const nav = document.getElementById('navbar');
    const user = getUserInfo();
    if (user) location.href = '/index.html';
    nav.innerHTML = `<div class="logo"><span>CB</span>OJ</div><div><a href="/index.html">首页</a></div><div class="right"><a href="/login.html">登录</a><a href="/register.html">注册</a></div>`;

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const nickname = document.getElementById('nickname').value || username;
      const password = document.getElementById('password').value;
      try {
        await register(username, password, nickname);
        // 注册成功自动登录（api.js 的 register 不自动保存 token，我们手动登录）
        await login(username, password);
        location.href = '/index.html';
      } catch (err) {
        document.getElementById('error').textContent = '注册失败：' + err.message;
      }
    });
  </script>
</body>
</html>
