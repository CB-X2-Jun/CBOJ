<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CBOJ - 题目</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="navbar"></nav>
  <div class="container">
    <div id="problem-content"></div>
    <div class="card">
      <h3>提交代码</h3>
      <form id="submit-form">
        <div class="form-group">
          <label>语言</label>
          <select id="language">
  <option value="C">C (gcc 14.2.0)</option>
  <option value="C++98">C++98 (g++ 14.2.0)</option>
  <option value="C++03">C++03 (g++ 14.2.0)</option>
  <option value="C++11">C++11 (g++ 14.2.0)</option>
  <option value="C++14">C++14 (g++ 14.2.0)</option>
  <option value="C++17" selected>C++17 (g++ 14.2.0)</option>
  <option value="C++20">C++20 (g++ 14.2.0)</option>
  <option value="C++23">C++23 (g++ 14.2.0)</option>
  <option value="C++26">C++26 (暂不支持)</option>

  <option value="Python2">Python 2.7.18</option>
  <option value="Python3">Python 3.12.6</option>
  <option value="PyPy2">PyPy 7.3.16 (Python 2.7)</option>
  <option value="PyPy3">PyPy 7.3.16 (Python 3.10)</option>

  <option value="Java8">Java 8 (OpenJDK 1.8.0_422)</option>
  <option value="Java21">Java 21 (OpenJDK 21.0.4)</option>

  <option value="Pascal">Pascal (Free Pascal 3.2.2)</option>
  <option value="PHP">PHP 8.3.13</option>
  <option value="D">D (GDC 14.2.0)</option>
  <option value="TeX">TeX (pdfTeX 3.141592653)</option>
  <option value="Lua">Lua 5.4.6</option>
  <option value="Rust">Rust 1.82.0</option>
  <option value="OCaml">OCaml 4.14.2</option>
  <option value="Perl">Perl 5.38.2</option>
  <option value="Eiffel">Eiffel (EiffelStudio 23.09)</option>
  <option value="Kotlin JVM">Kotlin JVM 2.0.20</option>
  <option value="C#">C# (Mono 6.12.0.200)</option>
  <option value="Scala">Scala 3.5.0</option>
  <option value="Haskell">Haskell (GHC 9.6.6)</option>
  <option value="Julia">Julia 1.10.5</option>
  <option value="Ruby">Ruby 3.2.6</option>
  <option value="Javascript">JavaScript (Node.js 20.18.0)</option>
  <option value="Typescript">TypeScript 5.6.3</option>
  <option value="BASIC">BASIC (bwBASIC 2.20)</option>
  <option value="Ada">Ada (GNAT 14.2.0)</option>
  <option value="F#">F# (F# 4.7 / Mono)</option>
  <option value="Powershell">PowerShell 7.4.6</option>
  <option value="Dart">Dart 3.5.4</option>
  <option value="Ceylon">Ceylon (已停止维护，v1.3.3)</option>
  <option value="Swift">Swift 6.0.2</option>
  <option value="Bash">Bash 5.2.32</option>
  <option value="Objective-C">Objective-C (Clang 18.1.8)</option>
  <option value="Objective-C++">Objective-C++ (Clang 18.1.8)</option>
  <option value="Brainfuck">Brainfuck (bf 20041219)</option>
  <option value="Tcl">Tcl 8.6.14</option>
  <option value="Fortran">Fortran (gfortran 14.2.0)</option>
  <option value="Go">Go 1.23.2</option>
  <option value="Erlang">Erlang 27.1</option>
  <option value="Prolog">Prolog (SWI-Prolog 9.2.6)</option>
  <option value="Lisp">Lisp (SBCL 2.4.5)</option>
  <option value="Common Lisp">Common Lisp (SBCL 2.4.5)</option>
</select>
            <!-- 更多可自行添加，完整列表见 worker 支持 -->
        </div>
        <div class="form-group">
          <label>代码</label>
          <textarea id="code" rows="10" placeholder="// 在此输入代码"></textarea>
        </div>
        <button type="submit" class="btn btn-success">提交评测</button>
      </form>
      <div id="submit-result" style="margin-top: 1rem;"></div>
    </div>
  </div>
  <script type="module">
    import { getProblem, submit, getUserInfo, logout } from '/js/api.js';
    // 导航栏
    const user = getUserInfo();
    document.getElementById('navbar').innerHTML = `
      <div class="logo"><span>CB</span>OJ</div>
      <div>
        <a href="/index.html">首页</a>
        <a href="/problems.html">题目</a>
        <a href="/submissions.html">提交记录</a>
        <a href="/rank.html">排行榜</a>
        <a href="/contests.html">比赛</a>
        ${user ? `<a href="/admin/problems.html" style="color: #f0b400;">管理</a>` : ''}
      </div>
      <div class="right">
        ${user ? `<span class="user">👤 ${user.username}</span> <button onclick="logout(); location.href='/index.html'">退出</button>` 
                : `<a href="/login.html">登录</a> <a href="/register.html">注册</a>`}
      </div>`; // 与上面一致，略

    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (!id) { document.getElementById('problem-content').innerHTML = '<p>未指定题目</p>'; }
    else {
      try {
        const problem = await getProblem(id);
        document.getElementById('problem-content').innerHTML = `
          <h1>${problem.id}. ${problem.title}</h1>
          <div class="card"><pre>${problem.description}</pre></div>
          <p>时间限制: ${problem.time_limit}ms | 内存限制: ${problem.memory_limit}MB</p>
        `;
      } catch (e) {
        document.getElementById('problem-content').innerHTML = '<p style="color:red;">题目不存在或加载失败</p>';
      }
    }

    // 提交
    document.getElementById('submit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!user) { alert('请先登录'); return; }
      const language = document.getElementById('language').value;
      const code = document.getElementById('code').value;
      if (!code.trim()) { alert('代码不能为空'); return; }
      try {
        const res = await submit(id, language, code);
        document.getElementById('submit-result').innerHTML = `✅ 提交成功！RID: <a href="/submission.html?rid=${res.rid}">${res.rid}</a> 状态: ${res.status}`;
      } catch (err) {
        document.getElementById('submit-result').innerHTML = `❌ 提交失败: ${err.message}`;
      }
    });
  </script>
</body>
</html>
