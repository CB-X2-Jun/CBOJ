<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBOJ - 题目详情</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <!-- KaTeX JS 和自动渲染扩展 -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/contrib/auto-render.min.js"></script>
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>

  <!-- CodeMirror 6 使用 jsdelivr CDN -->
  <script type="importmap">
    {
      "imports": {
        "@codemirror/state": "https://cdn.jsdelivr.net/npm/@codemirror/state@6.4.1/dist/index.js",
        "@codemirror/view": "https://cdn.jsdelivr.net/npm/@codemirror/view@6.28.0/dist/index.js",
        "@codemirror/commands": "https://cdn.jsdelivr.net/npm/@codemirror/commands@6.6.1/dist/index.js",
        "@codemirror/language": "https://cdn.jsdelivr.net/npm/@codemirror/language@6.10.1/dist/index.js",
        "@codemirror/autocomplete": "https://cdn.jsdelivr.net/npm/@codemirror/autocomplete@6.16.0/dist/index.js",
        "@codemirror/search": "https://cdn.jsdelivr.net/npm/@codemirror/search@6.5.6/dist/index.js",
        "@codemirror/theme-one-dark": "https://cdn.jsdelivr.net/npm/@codemirror/theme-one-dark@6.1.2/dist/index.js",
        "@codemirror/lang-cpp": "https://cdn.jsdelivr.net/npm/@codemirror/lang-cpp@6.0.2/dist/index.js",
        "@codemirror/lang-java": "https://cdn.jsdelivr.net/npm/@codemirror/lang-java@6.0.1/dist/index.js",
        "@codemirror/lang-javascript": "https://cdn.jsdelivr.net/npm/@codemirror/lang-javascript@6.2.2/dist/index.js",
        "@codemirror/lang-python": "https://cdn.jsdelivr.net/npm/@codemirror/lang-python@6.1.6/dist/index.js",
        "@codemirror/lang-rust": "https://cdn.jsdelivr.net/npm/@codemirror/lang-rust@6.0.1/dist/index.js",
        "@codemirror/lang-php": "https://cdn.jsdelivr.net/npm/@codemirror/lang-php@6.0.1/dist/index.js",
        "@codemirror/lang-go": "https://cdn.jsdelivr.net/npm/@codemirror/lang-go@6.0.1/dist/index.js",
        "@codemirror/lang-sql": "https://cdn.jsdelivr.net/npm/@codemirror/lang-sql@6.6.0/dist/index.js",
        "@codemirror/legacy-modes": "https://cdn.jsdelivr.net/npm/@codemirror/legacy-modes@6.3.4/dist/index.js",
        "codemirror": "https://cdn.jsdelivr.net/npm/codemirror@6.0.1/dist/index.js"
      }
    }
  </script>
  <style>
    .cm-editor { height: auto; min-height: 300px; }
    .cm-scroller { overflow: auto; font-family: 'Consolas', 'Courier New', monospace; }
    .cm-content { padding: 8px; }
  </style>
</head>
<body>
  <nav id="navbar"></nav>
  <div class="container">
    <div id="problem-content"></div>
    <div class="card" style="margin-top: 2rem;">
      <h3>📤 提交代码</h3>
      <!-- 工具栏 -->
      <div style="display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.8rem; align-items: center;">
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <label for="language" style="font-weight: 600;">语言</label>
          <select id="language" style="padding: 0.3rem 0.5rem; border-radius: 4px; border: 1px solid #ccc;">
            <option value="C">C (gcc 14.2.0)</option>
            <option value="C++98">C++98 (g++ 14.2.0)</option>
            <option value="C++03">C++03 (g++ 14.2.0)</option>
            <option value="C++11">C++11 (g++ 14.2.0)</option>
            <option value="C++14">C++14 (g++ 14.2.0)</option>
            <option value="C++17" selected>C++17 (g++ 14.2.0)</option>
            <option value="C++20">C++20 (g++ 14.2.0)</option>
            <option value="C++23">C++23 (g++ 14.2.0)</option>
            <option value="C++26">C++26 (g++ 14.2.0, 实验性)</option>
            <option value="Python3">Python 3.12.6</option>
            <option value="PyPy3">PyPy 7.3.16 (Python 3.10)</option>
            <option value="Java8">Java 8 (OpenJDK 1.8.0_422)</option>
            <option value="Java11">Java 11 (OpenJDK 11.0.24)</option>
            <option value="Java17">Java 17 (OpenJDK 17.0.12)</option>
            <option value="Java21">Java 21 (OpenJDK 21.0.4)</option>
            <option value="Javascript">JavaScript (Node.js 20.18.0)</option>
            <option value="Typescript">TypeScript 5.6.3</option>
            <option value="Rust">Rust 1.82.0</option>
            <option value="PHP">PHP 8.3.13</option>
            <option value="Go">Go 1.23.2</option>
            <option value="Ruby">Ruby 3.2.6</option>
            <option value="Swift">Swift 6.0.2</option>
            <option value="Lua">Lua 5.4.6</option>
            <option value="Perl">Perl 5.38.2</option>
            <option value="Bash">Bash 5.2.32</option>
            <!-- 更多语言（legacy-modes） -->
            <option value="Ada">Ada (GNAT 14.2.0)</option>
            <option value="BASIC">BASIC (Yabasic 2.90.3)</option>
            <option value="Brainfuck">Brainfuck (beef 1.0.0)</option>
            <option value="Ceylon">Ceylon (_old/1.3.3)</option>
            <option value="Clojure">Clojure 1.12.5</option>
            <option value="Common Lisp">Common Lisp (SBCL 2.4.5)</option>
            <option value="D">D (GDC 14.2.0)</option>
            <option value="Dart">Dart 3.5.4</option>
            <option value="Eiffel">Eiffel (Eiffel Studio 25.12)</option>
            <option value="Erlang">Erlang 27.1</option>
            <option value="F#">F# (F# 4.7 / Mono)</option>
            <option value="Fish">Fish ><> (fishr 0.1.0)</option>
            <option value="Fortran">Fortran (gfortran 14.2.0)</option>
            <option value="Haskell">Haskell (GHC 9.6.6)</option>
            <option value="Julia">Julia 1.10.5</option>
            <option value="Kotlin JVM">Kotlin JVM 2.0.20</option>
            <option value="Lisp">Lisp (SBCL 2.4.5)</option>
            <option value="Logo">Logo (UCBLogo 6.2.5)</option>
            <option value="Objective-C">Objective-C (Clang 18.1.8)</option>
            <option value="Objective-C++">Objective-C++ (Clang 18.1.8)</option>
            <option value="OCaml">OCaml 4.14.2</option>
            <option value="Pascal">Pascal (Free Pascal 3.2.2)</option>
            <option value="Prolog">Prolog (SWI-Prolog 9.2.6)</option>
            <option value="Scala">Scala 3.5.0</option>
            <option value="Tcl">Tcl 8.6.14</option>
          </select>
        </div>
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <label for="font-size" style="font-weight: 600;">字号</label>
          <input type="number" id="font-size" value="14" min="10" max="28" style="width: 60px; padding: 0.3rem; border-radius: 4px; border: 1px solid #ccc;">
          <span>px</span>
        </div>
        <button id="reset-editor-btn" class="btn" style="background: #6c757d; padding: 0.2rem 0.8rem;">重置编辑器</button>
      </div>

      <!-- CodeMirror 容器 -->
      <div id="editor-container" style="border: 1px solid #d1d5da; border-radius: 6px; overflow: hidden; min-height: 300px;"></div>

      <form id="submit-form" style="margin-top: 1rem;">
        <button type="submit" class="btn btn-success">提交评测</button>
      </form>
      <div id="submit-result" style="margin-top: 1rem;"></div>
    </div>
  </div>

  <script type="module">
    import { getProblem, submit, getUserInfo } from '/js/api.js';

    // ---------- CodeMirror 核心 ----------
    import { EditorView, basicSetup } from 'codemirror';
    import { EditorState } from '@codemirror/state';
    import { keymap } from '@codemirror/view';
    import { indentWithTab } from '@codemirror/commands';
    import { StreamLanguage } from '@codemirror/language';

    // ---------- 官方语言包 ----------
    import { cpp } from '@codemirror/lang-cpp';
    import { java } from '@codemirror/lang-java';
    import { python } from '@codemirror/lang-python';
    import { javascript } from '@codemirror/lang-javascript';
    import { rust } from '@codemirror/lang-rust';
    import { php } from '@codemirror/lang-php';
    import { go } from '@codemirror/lang-go';

    // ---------- legacy modes（兜底） ----------
    // 动态导入，避免全部加载
    async function loadLegacyMode(name) {
      const mod = await import(`https://cdn.jsdelivr.net/npm/@codemirror/legacy-modes@6.3.4/mode/${name}.js`);
      return mod.default || mod[Object.keys(mod)[0]];
    }

    // ---------- 用户 ----------
    const user = getUserInfo();

    // ---------- 导航栏 ----------
    const nav = document.getElementById('navbar');
    nav.innerHTML = `
      <div class="logo"><span>C</span>BOJ</div>
      <div>
        <a href="/index.html">首页</a>
        <a href="/problems.html">题目</a>
        <a href="/submissions.html">提交记录</a>
        <a href="/rank.html">排行榜</a>
        <a href="/contests.html">比赛</a>
        ${user ? `<a href="/admin/problems.html" style="color: #f0b400;">管理</a>` : ''}
      </div>
      <div class="right">
        ${user ? `<span class="user">👤 ${user.username}</span> <button onclick="localStorage.removeItem('token'); window.location.href='/index.html'">退出</button>` 
                : `<a href="/login.html">登录</a> <a href="/register.html">注册</a>`}
      </div>
    `;

    // ---------- 加载题目 ----------
    const params = new URLSearchParams(location.search);
    const problemId = params.get('id');
    if (!problemId) {
      document.getElementById('problem-content').innerHTML = '<p style="color:red;">未指定题目</p>';
    } else {
      try {
        const problem = await getProblem(problemId);
        const html = marked.parse(problem.description);
        document.getElementById('problem-content').innerHTML = `
          <h1>${problem.id}. ${problem.title}</h1>
          <p style="color: #6c757d; margin-bottom: 0.5rem;">
            难度: ${problem.difficulty || '入门'} | 总分: ${problem.total_score || 100}
          </p>
          <div class="card" style="margin-top: 1rem;">${html}</div>
          <p style="margin-top: 1rem;">时间限制: ${problem.time_limit}ms | 内存限制: ${problem.memory_limit}MB</p>
        `;
        setTimeout(() => {
          if (typeof renderMathInElement === 'function') {
            renderMathInElement(document.getElementById('problem-content'), {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
              ],
              throwOnError: false
            });
          }
        }, 100);
      } catch (err) {
        document.getElementById('problem-content').innerHTML = `<p style="color:red;">加载失败：${err.message}</p>`;
      }
    }

    // ---------- 编辑器 ----------
    const editorContainer = document.getElementById('editor-container');
    const languageSelect = document.getElementById('language');
    const fontSizeInput = document.getElementById('font-size');
    const resetBtn = document.getElementById('reset-editor-btn');

    // 语言映射：官方包
    const officialMap = {
      'C': cpp,
      'C#': cpp,
      'C++98': cpp,
      'C++03': cpp,
      'C++11': cpp,
      'C++14': cpp,
      'C++17': cpp,
      'C++20': cpp,
      'C++23': cpp,
      'C++26': cpp,
      'Java8': java,
      'Java11': java,
      'Java17': java,
      'Java21': java,
      'Python3': python,
      'PyPy3': python,
      'Javascript': javascript,
      'Typescript': javascript,
      'Rust': rust,
      'PHP': php,
      'Go': go,
      // 缺失的官方包由 legacy-modes 处理
    };

    // legacy 模式映射（文件名 -> 模式名）
    const legacyMap = {
      'Ada': 'ada',
      'BASIC': 'vb',
      'Brainfuck': 'brainfuck',
      'Ceylon': 'ceylon',
      'Clojure': 'clojure',
      'Common Lisp': 'commonlisp',
      'D': 'd',
      'Dart': 'dart',
      'Eiffel': 'eiffel',
      'Erlang': 'erlang',
      'F#': 'mllike',
      'Fish': 'javascript', // 回退
      'Fortran': 'fortran',
      'Haskell': 'haskell',
      'Julia': 'julia',
      'Lisp': 'commonlisp',
      'Logo': 'commonlisp',
      'Lua': 'lua',
      'Objective-C': 'clike',
      'Objective-C++': 'clike',
      'OCaml': 'mllike',
      'Pascal': 'pascal',
      'Perl': 'perl',
      'Prolog': 'prolog',
      'Ruby': 'ruby',
      'Scala': 'clike',
      'Swift': 'swift',
      'Tcl': 'tcl',
      'Bash': 'shell',
      'Powershell': 'powershell',
    };

    // 缓存
    const modeCache = new Map();

    async function getLanguageExtension(lang) {
      // 1. 官方包
      if (officialMap[lang]) {
        return officialMap[lang];
      }

      // 2. 缓存
      if (modeCache.has(lang)) {
        return modeCache.get(lang);
      }

      // 3. legacy modes
      const legacyName = legacyMap[lang];
      if (legacyName) {
        try {
          const parser = await loadLegacyMode(legacyName);
          if (parser) {
            // 某些模式是工厂函数（如 clike），需要特殊处理
            let ext;
            if (legacyName === 'clike') {
              // clike 需要配置，我们使用默认配置
              // 但 clike 导出了多个子模式：cpp, java, scala, objectivec 等
              // 我们直接从 mod 中取对应的子模式
              // 但为了简单，我们使用通用的 clike 配置
              // 由于 clike 是工厂，我们需要调用它
              // 但这里我们直接使用 mod 中导出的模式
              // 实际上，clike 导出了 c, cpp, java, scala 等
              // 我们根据语言选择
              const subMap = {
                'Objective-C': 'objectiveC',
                'Objective-C++': 'objectiveCpp',
                'Scala': 'scala',
              };
              const subMode = subMap[lang];
              if (subMode && parser[subMode]) {
                // 如果 mod 有子模式，使用子模式
                // 但 parser 是函数，子模式可能是属性
                // 我们需要处理
                // 简单方式：直接使用默认的 clike（C 风格）
                // 但这里我们尝试导入特定模式
                const subParser = await loadLegacyMode(subMode);
                if (subParser) {
                  ext = StreamLanguage.define(subParser);
                  modeCache.set(lang, ext);
                  return ext;
                }
              }
              // 回退到通用 C 风格
              ext = StreamLanguage.define(parser);
            } else if (legacyName === 'mllike') {
              // mllike 导出了 ocaml, fsharp, sml
              const subMap = { 'F#': 'fsharp', 'OCaml': 'ocaml' };
              const subMode = subMap[lang];
              if (subMode && parser[subMode]) {
                ext = StreamLanguage.define(parser[subMode]);
              } else {
                ext = StreamLanguage.define(parser);
              }
            } else if (legacyName === 'vb') {
              // VB 模式
              ext = StreamLanguage.define(parser);
            } else {
              ext = StreamLanguage.define(parser);
            }
            modeCache.set(lang, ext);
            return ext;
          }
        } catch (e) {
          console.warn(`Failed to load legacy mode for ${lang}:`, e);
        }
      }

      // 回退
      return javascript;
    }

    // 当前状态
    let editorView = null;
    let currentLang = languageSelect.value;

    function getBaseExtensions(fontSize, langExt) {
      const savedFont = localStorage.getItem('cboj-font-preference');
      const fontFamily = savedFont ? `"${savedFont}", "Consolas", "Courier New", monospace` : '"Consolas", "Courier New", monospace';
      return [
        basicSetup,
        keymap.of([indentWithTab]),
        EditorView.lineWrapping,
        EditorView.theme({
          '&': { fontSize: fontSize + 'px' },
          '.cm-scroller': { fontFamily: fontFamily },
          '.cm-content': { padding: '8px' },
        }),
        langExt,
      ];
    }

    async function initEditor(initialCode = '') {
      const fontSize = parseInt(fontSizeInput.value) || 14;
      const langExt = await getLanguageExtension(currentLang);
      const extensions = getBaseExtensions(fontSize, langExt);

      const state = EditorState.create({
        doc: initialCode,
        extensions: extensions,
      });

      editorView = new EditorView({
        state,
        parent: editorContainer,
      });
    }

    async function changeLanguage(newLang) {
      if (!editorView) return;
      currentLang = newLang;
      const langExt = await getLanguageExtension(newLang);
      const fontSize = parseInt(fontSizeInput.value) || 14;
      const extensions = getBaseExtensions(fontSize, langExt);
      const doc = editorView.state.doc;
      editorView.setState(EditorState.create({
        doc: doc,
        extensions: extensions,
      }));
    }

    async function updateFontSize(size) {
      if (!editorView) return;
      const langExt = await getLanguageExtension(currentLang);
      const extensions = getBaseExtensions(size, langExt);
      const doc = editorView.state.doc;
      editorView.setState(EditorState.create({
        doc: doc,
        extensions: extensions,
      }));
    }

    async function resetEditor() {
      if (!editorView) return;
      const langExt = await getLanguageExtension(currentLang);
      const fontSize = parseInt(fontSizeInput.value) || 14;
      const extensions = getBaseExtensions(fontSize, langExt);
      editorView.setState(EditorState.create({
        doc: '',
        extensions: extensions,
      }));
    }

    // 初始化
    initEditor('');

    // 事件绑定
    languageSelect.addEventListener('change', (e) => {
      changeLanguage(e.target.value);
    });

    fontSizeInput.addEventListener('change', (e) => {
      const val = parseInt(e.target.value) || 14;
      if (val < 10) e.target.value = 10;
      if (val > 28) e.target.value = 28;
      updateFontSize(parseInt(e.target.value));
    });

    resetBtn.addEventListener('click', resetEditor);

    // ---------- 提交 ----------
    document.getElementById('submit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!user) {
        alert('请先登录！');
        location.href = '/login.html';
        return;
      }
      if (!editorView) {
        alert('编辑器未初始化');
        return;
      }
      const code = editorView.state.doc.toString();
      if (!code.trim()) {
        alert('代码不能为空');
        return;
      }
      const language = languageSelect.value;
      try {
        const res = await submit(problemId, language, code);
        document.getElementById('submit-result').innerHTML = `✅ 提交成功！RID: <a href="/submission.html?rid=${res.rid}">${res.rid}</a> 状态: ${res.status}`;
      } catch (err) {
        document.getElementById('submit-result').innerHTML = `❌ 提交失败: ${err.message}`;
      }
    });
  </script>
</body>
</html>
