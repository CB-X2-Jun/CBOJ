<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBOJ - 题目详情</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>

  <!-- CodeMirror 5 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <!-- 常用模式（按需加载） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>  <!-- C/C++/Java/Objective-C/Scala -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/rust/rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/php/php.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/ruby/ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/swift/swift.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/lua/lua.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/perl/perl.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <!-- 更多 legacy 模式 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/fortran/fortran.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/haskell/haskell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/julia/julia.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/pascal/pascal.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/erlang/erlang.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/tcl/tcl.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/commonlisp/commonlisp.min.js"></script>
  <!-- 可能缺失的模式，可以回退到 plain -->
  <style>
    .CodeMirror { height: auto; min-height: 300px; border: 1px solid #d1d5da; border-radius: 6px; font-size: 14px; }
    .CodeMirror-scroll { min-height: 300px; }
    .cm-editor-toolbar { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.8rem; align-items: center; }
  </style>
</head>
<body>
  <nav id="navbar"></nav>
  <div class="container">
    <div id="problem-content"></div>
    <div class="card" style="margin-top: 2rem;">
      <h3>📤 提交代码</h3>
      <div class="cm-editor-toolbar">
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <label for="language" style="font-weight: 600;">语言</label>
          <select id="language" style="padding: 0.3rem 0.5rem; border-radius: 4px; border: 1px solid #ccc;">
            <option value="Ada">Ada (GNAT 13.2.0)</option>
            <option value="Bash">Bash 5.2.21</option>
            <option value="BASIC">BASIC (Yabasic 2.90.3)</option>
            <option value="Brainfuck">Brainfuck (beef 1.2.0)</option>
            <option value="C">C (gcc 13.2.0)</option>
            <option value="C#">C# (Mono 6.8.0.105)</option>
            <option value="C++98">C++98 (g++ 13.2.0)</option>
            <option value="C++03">C++03 (g++ 13.2.0)</option>
            <option value="C++11">C++11 (g++ 13.2.0)</option>
            <option value="C++14">C++14 (g++ 13.2.0)</option>
            <option value="C++17" selected>C++17 (g++ 13.2.0)</option>
            <option value="C++20">C++20 (g++ 13.2.0)</option>
            <option value="C++23">C++23 (g++ 13.2.0)</option>
            <option value="C++26">C++26 (g++ 13.2.0, 实验性)</option>
            <option value="Ceylon">Ceylon 1.3.3</option>
            <option value="Clojure">Clojure 1.12.5</option>
            <option value="Common Lisp">Common Lisp (SBCL 2.2.9)</option>
            <option value="D">D (GDC 13.2.0)</option>
            <option value="Dart">Dart 3.5.4</option>
            <option value="Eiffel">Eiffel (Eiffel Studio 25.12)</option>
            <option value="Elixir">Elixir 1.14.0</option>
            <option value="Erlang">Erlang 25.3.2.8</option>
            <option value="F#">F# (F# 4.0.0.4 / Mono)</option>
            <option value="Fish">Fish ><> (fishr 0.1.0)</option>
            <option value="Fortran">Fortran (gfortran 13.2.0)</option>
            <option value="Go">Go 1.22</option>
            <option value="Haskell">Haskell (GHC 9.4.7)</option>
            <option value="Java8">Java 8 (OpenJDK 1.8.0_492)</option>
            <option value="Java11">Java 11 (OpenJDK 11.0.31)</option>
            <option value="Java17">Java 17 (OpenJDK 17.0.19)</option>
            <option value="Java21">Java 21 (OpenJDK 21.0.11)</option>
            <option value="Javascript">JavaScript (Node.js 18.19.1)</option>
            <option value="Julia">Julia 1.10.5</option>
            <option value="Kotlin JVM">Kotlin JVM 1.3.31</option>
            <option value="Lisp">Lisp (SBCL 2.2.9)</option>
            <!-- <option value="Logo">Logo (UCBLogo 6.2.5)</option> -->
            <option value="Lua">Lua 5.4.6</option>
            <option value="Objective-C">Objective-C (Clang 18.1.3)</option>
            <option value="Objective-C++">Objective-C++ (Clang 18.1.3)</option>
            <option value="OCaml">OCaml 4.14.1</option>
            <option value="Pascal">Pascal (Free Pascal 3.2.2)</option>
            <option value="Perl">Perl 5.38.2</option>
            <option value="PHP">PHP 8.3.13</option>
            <option value="Prolog">Prolog (SWI-Prolog 9.0.4)</option>
            <option value="PyPy3">PyPy 7.3.15 (Python 3.10)</option>
            <option value="Python3">Python 3.12.3</option>
            <option value="Ruby">Ruby 3.2.6</option>
            <option value="Rust">Rust 1.75.0</option>
            <option value="Scala">Scala 2.11.12</option>
            <option value="Swift">Swift 2.33.0</option>
            <option value="Tcl">Tcl 8.6.14</option>
            <option value="Typescript">TypeScript 7.0.2</option>
          </select>
        </div>
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <label for="font-size" style="font-weight: 600;">字号</label>
          <input type="number" id="font-size" value="14" min="10" max="28" style="width: 60px; padding: 0.3rem; border-radius: 4px; border: 1px solid #ccc;">
          <span>px</span>
        </div>
        <button id="reset-editor-btn" class="btn" style="background: #6c757d; padding: 0.2rem 0.8rem;">重置编辑器</button>
      </div>

      <!-- 编辑器容器 -->
      <textarea id="editor-container"></textarea>

      <form id="submit-form" style="margin-top: 1rem;">
        <button type="submit" class="btn btn-success">提交评测</button>
      </form>
      <div id="submit-result" style="margin-top: 1rem;"></div>
    </div>
  </div>

  <script type="module">
    import { getProblem, submit, getUserInfo } from '/js/api.js';

    // ---------- 用户 ----------
    const user = getUserInfo();

    // ---------- 导航栏 ----------
    const nav = document.getElementById('navbar');
    nav.innerHTML = `
      <div class="logo"><span>CB</span>OJ</div>
      <div>
        <a href="/index.html">首页</a>
        <a href="/problems.html">题目</a>
        <a href="/submissions.html">提交记录</a>
        <a href="/rank.html">排行榜</a>
        <a href="/contests.html">比赛</a>
        ${user ? `<a href="/admin/problems.html" style="color: #f0b400;">管理</a>` : ''}
      </div>
      <div class="right">
        ${user ? `<span class="user">👤 ${user.username}</span> <button onclick="localStorage.removeItem('token'); window.location.href='/index.html'">退出</button>` 
                : `<a href="/login.html">登录</a> <a href="/register.html">注册</a>`}
      </div>
    `;

    // ---------- 加载题目 ----------
    const params = new URLSearchParams(location.search);
    const problemId = params.get('id');
    if (!problemId) {
      document.getElementById('problem-content').innerHTML = '<p style="color:red;">未指定题目</p>';
    } else {
      try {
        const problem = await getProblem(problemId);
        const html = marked.parse(problem.description);
        document.getElementById('problem-content').innerHTML = `
          <h1>${problem.id}. ${problem.title}</h1>
          <p style="color: #6c757d; margin-bottom: 0.5rem;">
            难度: ${problem.difficulty || '入门'} | 总分: ${problem.total_score || 100}
          </p>
          <div class="card" style="margin-top: 1rem;">${html}</div>
          <p style="margin-top: 1rem;">时间限制: ${problem.time_limit}ms | 内存限制: ${problem.memory_limit}MB</p>
        `;
        setTimeout(() => {
          if (typeof renderMathInElement === 'function') {
            renderMathInElement(document.getElementById('problem-content'), {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
              ],
              throwOnError: false
            });
          }
        }, 100);
      } catch (err) {
        document.getElementById('problem-content').innerHTML = `<p style="color:red;">加载失败：${err.message}</p>`;
      }
    }

    // ---------- CodeMirror 5 编辑器 ----------
    const textarea = document.getElementById('editor-container');
    const languageSelect = document.getElementById('language');
    const fontSizeInput = document.getElementById('font-size');
    const resetBtn = document.getElementById('reset-editor-btn');

    // 模式映射（CodeMirror 5 的 mode 名称）
    const modeMap = {
      'Ada': 'text/x-ada',
      'Bash': 'text/x-sh',
      'BASIC': 'text/x-vb',
      'Brainfuck': 'text/x-brainfuck',
      'C': 'text/x-csrc',
      'C#': 'text/x-csharp',
      'C++98': 'text/x-c++src',
      'C++03': 'text/x-c++src',
      'C++11': 'text/x-c++src',
      'C++14': 'text/x-c++src',
      'C++17': 'text/x-c++src',
      'C++20': 'text/x-c++src',
      'C++23': 'text/x-c++src',
      'C++26': 'text/x-c++src',
      'Ceylon': 'text/x-ceylon',
      'Clojure': 'text/x-clojure',
      'Common Lisp': 'text/x-common-lisp',
      'D': 'text/x-d',
      'Dart': 'text/x-dart',
      'Eiffel': 'text/x-eiffel',
      'Erlang': 'text/x-erlang',
      'F#': 'text/x-fsharp',
      'Fish': 'text/x-javascript', // 回退
      'Fortran': 'text/x-fortran',
      'Go': 'text/x-go',
      'Haskell': 'text/x-haskell',
      'Java8': 'text/x-java',
      'Java11': 'text/x-java',
      'Java17': 'text/x-java',
      'Java21': 'text/x-java',
      'Javascript': 'text/javascript',
      'Julia': 'text/x-julia',
      'Kotlin JVM': 'text/x-kotlin',
      'Lisp': 'text/x-common-lisp',
      'Logo': 'text/x-common-lisp',
      'Lua': 'text/x-lua',
      'Objective-C': 'text/x-objectivec',
      'Objective-C++': 'text/x-objectivec',
      'OCaml': 'text/x-ocaml',
      'Pascal': 'text/x-pascal',
      'Perl': 'text/x-perl',
      'PHP': 'text/x-php',
      'Prolog': 'text/x-prolog',
      'PyPy3': 'text/x-python',
      'Python3': 'text/x-python',
      'Ruby': 'text/x-ruby',
      'Rust': 'text/x-rust',
      'Scala': 'text/x-scala',
      'Swift': 'text/x-swift',
      'Tcl': 'text/x-tcl',
      'Typescript': 'text/typescript',
    };

    // 当前编辑器实例
    let editor = null;

    // 初始化编辑器
    function initEditor(initialCode = '') {
      const mode = modeMap[languageSelect.value] || 'text/plain';
      const fontSize = parseInt(fontSizeInput.value) || 14;
      const savedFont = localStorage.getItem('cboj-font-preference');
      const fontFamily = savedFont ? `"${savedFont}", "Consolas", "Courier New", monospace` : '"Consolas", "Courier New", monospace';

      editor = CodeMirror.fromTextArea(textarea, {
        mode: mode,
        lineNumbers: true,
        indentUnit: 4,
        tabSize: 4,
        indentWithTabs: false,
        lineWrapping: true,
        theme: 'default',
        viewportMargin: Infinity,
        extraKeys: {
          'Tab': 'indentMore',
          'Shift-Tab': 'indentLess'
        },
        styleActiveLine: true,
        matchBrackets: true,
        autoCloseBrackets: true,
        autoCloseTags: true,
        foldGutter: true,
        gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
      });

      // 设置字体
      editor.getWrapperElement().style.fontSize = fontSize + 'px';
      editor.getWrapperElement().style.fontFamily = fontFamily;

      // 设置初始内容
      if (initialCode) {
        editor.setValue(initialCode);
      }

      // 监听改变，调整高度（自动）
      editor.on('change', () => {
        editor.refresh();
      });

      // 首次刷新
      setTimeout(() => editor.refresh(), 50);
    }

    // 切换语言
    function changeLanguage(newLang) {
      if (!editor) return;
      const mode = modeMap[newLang] || 'text/plain';
      editor.setOption('mode', mode);
      // 有些模式需要额外加载，但 CodeMirror 会尝试加载，如果未加载则会报错，但不会影响已有功能
      // 为了安全，可以尝试手动加载模式（但 CDN 已预加载多数常用模式）
    }

    // 更新字号
    function updateFontSize(size) {
      if (!editor) return;
      editor.getWrapperElement().style.fontSize = size + 'px';
      editor.refresh();
    }

    // 重置内容
    function resetEditor() {
      if (!editor) return;
      editor.setValue('');
    }

    // 启动
    initEditor('');

    // 事件绑定
    languageSelect.addEventListener('change', (e) => {
      changeLanguage(e.target.value);
    });

    fontSizeInput.addEventListener('change', (e) => {
      const val = parseInt(e.target.value) || 14;
      if (val < 10) e.target.value = 10;
      if (val > 28) e.target.value = 28;
      updateFontSize(parseInt(e.target.value));
    });

    resetBtn.addEventListener('click', resetEditor);

    // ---------- 提交 ----------
    document.getElementById('submit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!user) {
        alert('请先登录！');
        location.href = '/login.html';
        return;
      }
      if (!editor) {
        alert('编辑器未初始化');
        return;
      }
      const code = editor.getValue();
      if (!code.trim()) {
        alert('代码不能为空');
        return;
      }
      const language = languageSelect.value;
      try {
        const res = await submit(problemId, language, code);
        document.getElementById('submit-result').innerHTML = `✅ 提交成功！RID: <a href="/submission.html?rid=${res.rid}">${res.rid}</a> 状态: ${res.status}`;
      } catch (err) {
        document.getElementById('submit-result').innerHTML = `❌ 提交失败: ${err.message}`;
      }
    });
  </script>
</body>
</html>
