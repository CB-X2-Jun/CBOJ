<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CBOJ - 编辑题目</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="navbar"></nav>
  <div class="container" style="max-width: 800px;">
    <h1 id="form-title">新建题目</h1>
    <form id="problem-form">
      <div class="form-group">
        <label>题号（唯一标识）</label>
        <input type="text" id="id" required>
      </div>
      <div class="form-group">
        <label>标题</label>
        <input type="text" id="title" required>
      </div>
      <div class="form-group">
        <label>题面（支持 Markdown，与公式）</label>
        <textarea id="description" rows="6" required></textarea>
      </div>
      <div class="form-group">
        <label>时间限制（ms）</label>
        <input type="number" id="time_limit" value="1000">
      </div>
      <div class="form-group">
        <label>内存限制（MB）</label>
        <input type="number" id="memory_limit" value="256">
      </div>
      <div class="form-group">
        <label>测试点（JSON 数组，每个元素含 input 和 output）</label>
        <textarea id="test_cases" rows="5" required>[{"input":"1 2","output":"3"}]</textarea>
      </div>
      <button type="submit" class="btn btn-success">保存</button>
      <a href="/admin/problems.html" class="btn" style="background: #6c757d; margin-left: 0.5rem;">返回列表</a>
    </form>
    <div id="error" style="color:red; margin-top:1rem;"></div>
  </div>
  <script type="module">
    import { getProblem, createProblem, updateProblem, getUserInfo } from '/js/api.js';

    // ✅ 1. 先获取用户信息（必须在导航栏渲染之前）
    const user = getUserInfo();

    // ✅ 2. 检查管理员权限
    if (!user || !user.isAdmin) {
      location.href = '/index.html';
    }

    // ✅ 3. 渲染导航栏（此时 user 已定义）
    const nav = document.getElementById('navbar');
    nav.innerHTML = `
      <div class="logo"><span>C</span>BOJ</div>
      <div>
        <a href="/index.html">首页</a>
        <a href="/problems.html">题目</a>
        <a href="/submissions.html">提交记录</a>
        <a href="/rank.html">排行榜</a>
        <a href="/contests.html">比赛</a>
        ${user ? `<a href="/admin/problems.html" style="color: #f0b400;">管理</a>` : ''}
      </div>
      <div class="right">
        ${user ? `<span class="user">👤 ${user.username}</span> <button onclick="localStorage.removeItem('token'); window.location.href='/index.html'">退出</button>` 
                : `<a href="/login.html">登录</a> <a href="/register.html">注册</a>`}
      </div>
    `;

    // ✅ 4. 处理编辑/新建逻辑
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const isEdit = !!id;
    
    if (isEdit) {
      document.getElementById('form-title').textContent = '编辑题目';
      try {
        const problem = await getProblem(id);
        if (problem) {
          document.getElementById('id').value = problem.id;
          document.getElementById('id').readOnly = true;
          document.getElementById('title').value = problem.title;
          document.getElementById('description').value = problem.description;
          document.getElementById('time_limit').value = problem.time_limit;
          document.getElementById('memory_limit').value = problem.memory_limit;
          // 美化 JSON 显示
          try {
            const testCases = JSON.parse(problem.test_cases);
            document.getElementById('test_cases').value = JSON.stringify(testCases, null, 2);
          } catch {
            document.getElementById('test_cases').value = problem.test_cases;
          }
        }
      } catch (err) {
        document.getElementById('error').textContent = '加载题目失败：' + err.message;
      }
    }

    // ✅ 5. 提交表单
    document.getElementById('problem-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('error').textContent = '';

      const id = document.getElementById('id').value.trim();
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const time_limit = parseInt(document.getElementById('time_limit').value);
      const memory_limit = parseInt(document.getElementById('memory_limit').value);
      let test_cases;

      // ✅ 校验 + 解析 JSON
      try {
        test_cases = JSON.parse(document.getElementById('test_cases').value);
        if (!Array.isArray(test_cases) || test_cases.length === 0) {
          throw new Error('测试点必须是非空数组');
        }
      } catch (err) {
        document.getElementById('error').textContent = '测试点 JSON 格式错误：' + err.message;
        return;
      }

      if (!id || !title || !description) {
        document.getElementById('error').textContent = '请填写完整信息';
        return;
      }

      const data = { id, title, description, time_limit, memory_limit, test_cases };

      try {
        if (isEdit) {
          await updateProblem(id, data);
        } else {
          await createProblem(data);
        }
        location.href = '/admin/problems.html';
      } catch (err) {
        document.getElementById('error').textContent = '保存失败：' + err.message;
      }
    });
  </script>
</body>
</html>
