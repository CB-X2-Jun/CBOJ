<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CBOJ - 提交详情</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="navbar"></nav>
  <div class="container">
    <h1>📄 提交详情 #<span id="rid-display"></span></h1>
    <div id="submission-info" class="card"></div>
    <div id="details-area" class="card" style="margin-top:1rem;">
      <h3>测试点详情</h3>
      <div id="details-grid" style="display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 0.5rem;"></div>
    </div>
    <div id="code-area" class="card" style="margin-top:1rem;">
      <h3>代码</h3>
      <pre id="code-content"></pre>
    </div>
    <div id="admin-actions"></div>
  </div>
  <script type="module">
    import { getSubmission, cancelSubmission, getUserInfo } from '/js/api.js';

    const nav = document.getElementById('navbar');
    const user = getUserInfo();
    nav.innerHTML = `
      <div class="logo"><span>CB</span>OJ</div>
      <div>
        <a href="/index.html">首页</a>
        <a href="/problems.html">题目</a>
        <a href="/submissions.html">提交记录</a>
        <a href="/rank.html">排行榜</a>
        <a href="/contests.html">比赛</a>
        ${user ? `<a href="/admin/problems.html" style="color: #f0b400;">管理</a>` : ''}
      </div>
      <div class="right">
        ${user ? `<span class="user">👤 ${user.username}</span> <button onclick="localStorage.removeItem('token'); window.location.href='/index.html'">退出</button>` 
                : `<a href="/login.html">登录</a> <a href="/register.html">注册</a>`}
      </div>
    `;

    const params = new URLSearchParams(location.search);
    const rid = parseInt(params.get('rid'));
    if (!rid) { document.body.innerHTML += '<p>缺少参数</p>'; }

    const data = await getSubmission(rid);
    document.getElementById('rid-display').textContent = rid;

    const scoreDisplay = data.score !== undefined && data.score !== null 
      ? `${data.score}/${data.max_score || 100}` 
      : '不可用';

    document.getElementById('submission-info').innerHTML = `
      <p><strong>用户：</strong>${data.username}</p>
      <p><strong>题目：</strong><a href="/problem.html?id=${data.problem_id}">${data.problem_title || data.problem_id}</a></p>
      <p><strong>语言：</strong>${data.language}</p>
      <p><strong>状态：</strong><span class="status-${data.status}">${data.status}</span></p>
      <p><strong>得分：</strong>${scoreDisplay}</p>
      <p><strong>耗时：</strong>${data.time_used ?? '-'}ms</p>
      <p><strong>内存：</strong>${data.memory_used ?? '-'}MB</p>
      <p><strong>提交时间：</strong>${new Date(data.created_at).toLocaleString()}</p>
      ${data.finished_at ? `<p><strong>完成时间：</strong>${new Date(data.finished_at).toLocaleString()}</p>` : ''}
      ${data.result ? `<p><strong>结果详情：</strong><pre>${data.result}</pre></p>` : ''}
    `;

    // 渲染测试点详情
    const detailsGrid = document.getElementById('details-grid');
    const details = data.details || [];

    if (details.length === 0) {
      detailsGrid.innerHTML = '<p style="color: #6c757d;">数据点信息不可用（可能是本次大改前的提交）</p>';
    } else {
      detailsGrid.innerHTML = details.map((d, idx) => {
        const statusMap = {
          'accepted': { label: 'AC', color: '#28a745' },
          'wrong_answer': { label: 'WA', color: '#d73a49' },
          'time_limit_exceeded': { label: 'TLE', color: '#1a237e' },
          'memory_limit_exceeded': { label: 'MLE', color: '#1a237e' },
          'runtime_error': { label: 'RE', color: '#6f42c1' },
        };
        const statusInfo = statusMap[d.status] || { label: d.status.toUpperCase(), color: '#6c757d' };
        const timeStr = d.time_used !== null && d.time_used !== undefined ? `${d.time_used}ms` : '-ms';
        const memStr = d.memory_used !== null && d.memory_used !== undefined ? `${(d.memory_used / 1024).toFixed(2)}MB` : '-MB';
        
        return `
          <div style="background: ${statusInfo.color}; color: white; border-radius: 4px; padding: 0.8rem 1rem; min-width: 110px; text-align: center; font-size: 0.85rem;">
            <div style="font-weight: bold; font-size: 0.75rem; opacity: 0.8;">#${idx + 1}</div>
            <div style="font-size: 1.1rem; font-weight: bold; margin: 0.2rem 0;">${statusInfo.label}</div>
            <div style="font-size: 0.7rem; opacity: 0.9;">${timeStr}</div>
            <div style="font-size: 0.7rem; opacity: 0.9;">${memStr}</div>
          </div>
        `;
      }).join('');
    }

    // 代码仅当是自己或管理员才显示
    if (user && (user.uid === data.uid || user.isAdmin)) {
      document.getElementById('code-content').textContent = data.code || '（无代码）';
    } else {
      document.getElementById('code-content').textContent = '（你无权查看此代码）';
    }

    // 管理员取消功能
    if (user && user.isAdmin) {
      document.getElementById('admin-actions').innerHTML = `
        <button class="btn btn-danger" id="cancel-btn">取消/无效化此提交</button>
      `;
      document.getElementById('cancel-btn').addEventListener('click', async () => {
        if (confirm('确定要取消此提交吗？')) {
          await cancelSubmission(rid);
          alert('已取消');
          location.reload();
        }
      });
    }
  </script>
</body>
</html>
